<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updating Alert Tradie Pro</title><style>body{display:grid;min-height:100vh;margin:0;padding:24px;background:#080909;color:#fff;font:14px/1.6 Arial,sans-serif;place-items:center}.card{width:min(520px,100%);padding:36px;border:1px solid #303131;background:#111212}.gold{width:52px;height:4px;margin-bottom:24px;background:#f5b900}h1{margin:0 0 12px;font-size:36px;letter-spacing:-.04em}p{color:#a7aaaa}</style></head>
<body><main class="card"><div class="gold"></div><h1>Loading the newest version…</h1><p id="status">Clearing the previous website cache.</p></main><script>(async()=>{try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(item=>item.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}document.getElementById('status').textContent='Update complete. Opening Alert Tradie Pro V67…';setTimeout(()=>location.replace('./?v=67-'+Date.now()),650)}catch(error){document.getElementById('status').textContent='Please close this tab, reopen the site and refresh once.'}})()</script></body>
</html>
